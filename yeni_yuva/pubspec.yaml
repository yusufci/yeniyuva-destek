name: yeni_yuva
description: "YeniYuva - Göçmen Destek ve Bilgilendirme Platformu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Supabase
  supabase_flutter: ^2.8.4

  # Google Maps
  google_maps_flutter: ^2.10.0

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Local Database (Offline)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Network
  connectivity_plus: ^6.1.1
  http: ^1.2.2

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.6

  # Internationalization
  intl: ^0.20.2

  # Functional Programming
  dartz: ^0.10.1

  # Code Generation (runtime)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utils
  equatable: ^2.0.7
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  flutter_dotenv: ^5.2.1
  logger: ^2.5.0
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  riverpod_generator: ^2.6.3
  go_router_builder: ^2.7.1
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env
